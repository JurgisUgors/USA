name: Izsoļu monitors

on:
  schedule:
    - cron: "17 6 * * 1"   # katru pirmdienu ~08:17/09:17 pēc Rīgas laika
  workflow_dispatch:        # var palaist arī ar roku (Actions → Run workflow)

permissions:
  contents: write
  issues: write

concurrency: izsoles-monitors

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalēt atkarības
        run: pip install -r izsoles-monitors/requirements.txt
      - name: Pārbaudīt lapas
        run: python izsoles-monitors/monitor.py
      - name: Izveidot Issue, ja ir jaunumi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s izsoles-monitors/new_items.md ]; then
            gh issue create \
              --title "Izsoļu monitors: jaunumi $(date +%Y-%m-%d)" \
              --body-file izsoles-monitors/new_items.md
          fi
      - name: Saglabāt stāvokli
        run: |
          git config user.name "izsoles-monitors"
          git config user.email "actions@users.noreply.github.com"
          git add izsoles-monitors/state.json
          git diff --cached --quiet || git commit -m "Izsoļu monitors: atjaunots stāvoklis"
          git push
